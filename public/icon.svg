<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#241a00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111317"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE088"/>
      <stop offset="50%" stop-color="#F2CA50"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="vellumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#EBE0C8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#111317"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Ornate Gilded Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" fill="none"/>
  <rect x="36" y="36" width="440" height="440" rx="80" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6" fill="none"/>

  <!-- Open Manuscript Folio Pages -->
  <!-- Left Page -->
  <path d="M256 380 C220 370 140 370 100 380 C95 381 92 376 92 370 L102 170 C102 165 106 160 112 160 C150 152 220 152 256 164 Z" fill="url(#vellumGrad)" stroke="#796241" stroke-width="3"/>
  <!-- Right Page -->
  <path d="M256 380 C292 370 372 370 412 380 C417 381 420 376 420 370 L410 170 C410 165 406 160 400 160 C362 152 292 152 256 164 Z" fill="url(#vellumGrad)" stroke="#796241" stroke-width="3"/>
  <!-- Book Spine Groove -->
  <path d="M256 164 L256 380" stroke="#574236" stroke-width="4" stroke-linecap="round"/>

  <!-- Manuscript Text Filigree Lines -->
  <line x1="130" y1="200" x2="230" y2="204" stroke="#785b30" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="130" y1="228" x2="225" y2="232" stroke="#785b30" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="130" y1="256" x2="220" y2="260" stroke="#785b30" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="130" y1="284" x2="230" y2="288" stroke="#785b30" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>

  <line x1="282" y1="204" x2="382" y2="200" stroke="#785b30" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="287" y1="232" x2="382" y2="228" stroke="#785b30" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="292" y1="260" x2="382" y2="256" stroke="#785b30" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="282" y1="288" x2="382" y2="284" stroke="#785b30" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Alchemical Golden Candle Flame above the Codex -->
  <path d="M256 130 C242 108 244 80 256 60 C268 80 270 108 256 130 Z" fill="url(#goldGrad)"/>
  <circle cx="256" cy="100" r="8" fill="#FFF2BD"/>
</svg>
